services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: apibe_app
    working_dir: /src
    user: "1000:1000"
    command: >
      sh -c "dotnet tool restore &&
             dotnet watch run --no-hot-reload --urls http://0.0.0.0:8080 --no-launch-profile"
    ports:
      - "8000:8080"
    volumes:
      - .:/src
    environment:
      HOME: /tmp
      DOTNET_CLI_HOME: /tmp
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=apibe;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.75

  db:
    image: postgres:16-alpine
    container_name: apibe_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apibe
    ports:
      - "5433:5432"
    volumes:
      - apibe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apibe"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 0.5

volumes:
  apibe_pgdata: